    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>

  </body>
